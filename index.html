<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2d2d2d"><meta name="apple-mobile-web-app-capable" content="yes"><title>Sparkasse</title>
<style>
:root{--bg:#1a1a1a;--hd:#2d2d2d;--cd:#2b2b2b;--bd:#474747;--r:#e60000;--g:#9cc873;--m:#bdbdbd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13.5px}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:-apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif;overflow:hidden}
body{font-size:1rem}
#app{height:100%;max-width:480px;margin:auto;position:relative}
.scr{position:absolute;inset:0;overflow-y:auto;padding-bottom:6.5rem;-webkit-overflow-scrolling:touch}
svg{display:block;flex:none}.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hd{background:var(--hd);padding:calc(env(safe-area-inset-top) + .5rem) 1rem 1rem;text-align:center}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:2.8rem}.bar b{font-size:1.15rem;font-weight:600}
.bk{width:2.8rem;display:flex;align-items:center}
.bd{padding:1rem}
.logo{width:2.9rem;height:2.9rem;border-radius:50%;background:var(--r);display:grid;place-items:center;flex:none}
.logo svg{width:62%;height:62%}.logo.l{width:5rem;height:5rem;margin:1.6rem auto}
.tc{width:2.8rem;height:2.8rem;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;color:#222}.tc.dash{background:#2b2b2b;border:1.5px dashed #777}.tc.dk{background:#3b3b3b;color:#fff}.tc.r{background:var(--r)}
.cb{width:2.9rem;height:2.9rem;border-radius:50%;border:1px solid #4f4f4f;background:#3a3a3a;display:grid;place-items:center;flex:none}
.row{display:flex;align-items:center;gap:.8rem}.sp{justify-content:space-between}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:1rem;margin-bottom:1rem;overflow:hidden}
.ch{padding:1rem;display:flex;align-items:center;justify-content:space-between}.ch b{font-size:1.2rem;font-weight:600}.ch .row{gap:.6rem}
.cr{border-top:1px solid var(--bd);padding:1rem}
.cr b.t{font-size:1.2rem;font-weight:600}.cr .s{font-size:.95rem;color:#e0e0e0;margin-top:.15rem}
.gr{color:var(--g);font-size:1.25rem;font-weight:500;text-align:right;margin-top:.5rem}
.sm{color:var(--m);font-size:.9rem}
.pill{background:var(--g);color:#1d3a0b;font-weight:700;padding:.35rem .9rem;border-radius:99px;white-space:nowrap}.pill.n{background:none;color:#fff;padding:0;font-weight:600}
.amt{color:var(--g);font-size:2.3rem;font-weight:600;margin:.1rem 0}
.fld{position:relative;margin-bottom:1rem;border:1px solid #6a6a6a;border-radius:.7rem;background:#222;padding:.55rem .9rem .35rem}
.fld:focus-within{border:2px solid #6aa9ff;padding:calc(.55rem - 1px) calc(.9rem - 1px) calc(.35rem - 1px);box-shadow:0 0 0 2px rgba(106,169,255,.35)}
.fld label{display:block;font-size:.85rem;color:#cfcfcf;margin-bottom:.1rem}
.fld input,.fld select{width:100%;background:none;border:0;outline:0;color:#fff;font-size:1.1rem;padding:.25rem 0 .3rem;font-family:inherit}
.fld select option{background:#222}
.btn{width:100%;padding:1rem;border:0;border-radius:99px;background:#ee0000;color:#fff;font-size:1.15rem;font-weight:700;font-family:inherit}
.btn.g{background:none;border:1px solid #777;margin-top:.7rem}.btn:active{opacity:.8}
.lnk{color:#fff;text-decoration:underline;text-align:center;display:block;margin:1.4rem;font-weight:600;font-size:1.1rem}
.tog{width:3.6rem;height:2.1rem;border-radius:99px;background:#3a3a3a;position:relative;flex:none;transition:.2s}.tog:after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.7rem;height:1.7rem;border-radius:50%;background:#fff;transition:.2s}
.tog:before{content:"";position:absolute;right:.55rem;top:.7rem;width:.75rem;height:.75rem;border:1.5px solid #bbb;border-radius:50%}.tog.on{background:#34c759}.tog.on:after{left:1.7rem}.tog.on:before{display:none}
.qa{display:flex;gap:.3rem;overflow-x:auto;padding:.3rem 0 .6rem;scrollbar-width:none}.qa::-webkit-scrollbar{display:none}
.qa>div{flex:none;width:6.6rem;text-align:center;font-size:.95rem;font-weight:600;line-height:1.2}.qa .cb{width:4.4rem;height:4.4rem;margin:0 auto .5rem}
.tabs{display:flex;gap:.6rem;overflow-x:auto;margin:.8rem 0 1rem;scrollbar-width:none}.tabs span{flex:none;border:1.5px solid #8a8a8a;border-radius:99px;padding:.6rem 1.3rem;font-weight:600;font-size:1.05rem}
.tabs span.on{background:#fff;color:#000;border-color:#fff}.srch{display:flex;align-items:center;justify-content:space-between;background:#3c3c3c;border-radius:.9rem;padding:1.1rem 1.2rem;color:#d4d4d4;margin-bottom:1.2rem;font-size:1.1rem}
.ban{background:#8fc9ff;color:#0b2a4a;border-radius:.9rem;padding:1rem;margin-bottom:1.2rem;display:flex;gap:.8rem;font-size:1rem;line-height:1.3}.ban u{font-weight:600;display:block;margin-top:.5rem}
.dt{color:#e6e6e6;margin:1.4rem .3rem .6rem;font-size:1.05rem}.mh{font-size:1.7rem;font-weight:600;margin:1.8rem .3rem .2rem}
.tx{padding:1rem;margin-bottom:.8rem}.tx .n{font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}.tx .d{font-size:.95rem;color:#e0e0e0;margin-top:.1rem;overflow-wrap:anywhere}.tx .a{text-align:right;margin-top:.5rem}
.tab{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:flex;padding:.6rem .3rem calc(env(safe-area-inset-bottom) + .4rem);background:rgba(45,45,45,.85);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border-top:1px solid rgba(255,255,255,.1);z-index:5}
.tab div{flex:1;display:flex;flex-direction:column;align-items:center;gap:.25rem;font-size:.82rem;font-weight:600;color:#e6e6e6}.tab .on{color:#fff}.tab .on svg{filter:drop-shadow(0 0 0 #fff)}
.tab .nb{position:relative}.tab .nb:after{content:"";position:absolute;right:-3px;top:-2px;width:.6rem;height:.6rem;border-radius:50%;background:#4aa3ff}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + .6rem);left:50%;transform:translate(-50%,-140px);padding:.8rem 1.3rem;z-index:30;transition:.35s;font-weight:600;background:rgba(60,60,60,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);border-radius:99px;max-width:92%;text-align:center}#toast.show{transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:480px;background:rgba(48,48,48,.9);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border-radius:1.6rem 1.6rem 0 0;padding:1.4rem 1rem calc(env(safe-area-inset-bottom) + 1.2rem);border-top:1px solid rgba(255,255,255,.2)}
.chip{display:inline-block;padding:.5rem 1rem;border-radius:99px;border:1px solid #777;margin-right:.5rem;font-weight:600}.chip.on{background:#fff;color:#000}
.ok{width:6rem;height:6rem;border-radius:50%;background:var(--g);color:#1d3a0b;display:grid;place-items:center;margin:2.5rem auto 1.2rem}
.x{color:#ff6b6b;font-size:1.3rem;padding:.3rem .6rem}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--bd);font-size:1rem}.kv span:first-child{color:var(--m)}.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.sticky{position:sticky;bottom:0;padding:1rem;background:linear-gradient(transparent,var(--bg) 35%)}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
let DB={};
try{DB=JSON.parse(localStorage.sk||'null')||{}}catch(e){}
if(!DB.users){try{if(window.name.startsWith('SK:'))DB=JSON.parse(window.name.slice(3))}catch(e){}}
DB.users=DB.users||{};
const save=()=>{const s=JSON.stringify(DB);try{localStorage.sk=s}catch(e){}try{window.name='SK:'+s}catch(e){}};
let view='login',tab='start',sub=null,arg=null,me=null,q='',flt='all',draft={},H=[],rem=!!DB.rem,ht='fin',col={},ban=1;
const AN={giro:'LzO GiroStart',sav:'KNAX-Sparkassenbuch'};
const MO=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const P={
send:'<rect x="2.5" y="8" width="15" height="11" rx="2.2"/><path d="M13.6 11a2.4 2.4 0 1 0 0 4.2M7 12.3h4.4M7 14h3.8"/><path d="M15.5 2.8h5.7v5.7M21.2 2.8l-6.3 6.3"/>',
det:'<rect x="2.5" y="3.5" width="16" height="13" rx="2.2"/><path d="M6 7.5h8M6 10.8h5"/><circle cx="17" cy="17" r="4.6" style="fill:var(--ib,#3a3a3a)"/><path d="M17 16.2v3.1M17 14.3v.1"/>',
srch:'<path d="M3 5.5h8.5M3 10.5h5.5M3 15.5h7.5"/><circle cx="15" cy="12.5" r="5"/><path d="M18.8 16.5L22 20"/>',
clk:'<rect x="2.5" y="3.5" width="16" height="13" rx="2.2"/><path d="M6 7.5h8M6 10.8h5"/><circle cx="17" cy="17" r="4.6" style="fill:var(--ib,#3a3a3a)"/><path d="M17 14.8v2.5l1.8 1"/>',
cal:'<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.8v3.4M16 2.8v3.4M8 14h3"/>',
home:'<path d="M12 2.8L2.8 10.5V21h6.4v-6.2h5.6V21h6.4V10.5z" fill="currentColor" stroke-width="1.2"/>',
homeo:'<path d="M12 2.8L2.8 10.5V21h6.4v-6.2h5.6V21h6.4V10.5z"/>',
prod:'<rect x="6" y="3.5" width="12" height="4" rx="1.4"/><rect x="4" y="8.8" width="16" height="4.6" rx="1.4"/><rect x="2.8" y="14.4" width="18.4" height="6" rx="1.6"/>',
serv:'<path d="M12 2.8l7.6 3.2v5.6c0 4.6-3.3 8.3-7.6 9.6-4.3-1.3-7.6-5-7.6-9.6V6z"/><path d="M12 8l1.5 3 3.3.4-2.4 2.3.6 3.3-3-1.6-3 1.6.6-3.3-2.4-2.3 3.3-.4z"/>',
prof:'<circle cx="12" cy="8" r="4.2"/><path d="M3.8 21c.3-4.6 3.6-7 8.2-7s7.9 2.4 8.2 7z"/>',
help:'<path d="M12 2.8a9.2 9.2 0 1 1-4.5 17.2L3 21l1.2-4.2A9.2 9.2 0 0 1 12 2.8z"/><path d="M9.5 9.6a2.6 2.6 0 1 1 3.9 2.2c-.9.5-1.4 1-1.4 2M12 16.8v.1"/>',
bell:'<path d="M5.5 17V11a6.5 6.5 0 0 1 13 0v6l1.8 2H3.7zM10 21.5h4"/>',
mic:'<rect x="9" y="2.8" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.2"/>',
rock:'<path d="M14.5 3.5c4 0 6 2 6 6-1.8 4.2-5 7.2-9 8.2L7.300 14c.9-4 3.800-7.300 7.200-10.500z"/><circle cx="14.700" cy="9.300" r="1.600"/><path d="M7.300 14l-3.300 1 2.500 2.500M10 17l-1 3.300 3.300-2.500"/>',
pin:'<path d="M10.500 21s6-5 6-10.500a6 6 0 1 0-12 0C4.500 16 10.500 21 10.500 21z"/><circle cx="10.500" cy="10.500" r="2.300"/><path d="M15 16.500h6M15 19.500h6M16 14h4v6h-4z"/>',
bk:'<path d="M20.500 12H4.500M10.500 5.800L4.300 12l6.200 6.200"/>',
up:'<path d="M5 15l7-7 7 7"/>',dn:'<path d="M5 9l7 7 7-7"/>',x:'<path d="M5 5l14 14M19 5L5 19"/>',
info:'<circle cx="12" cy="12" r="9.500"/><path d="M12 11v6M12 7.500v.1"/>',
chev:'<path d="M9 5l7 7-7 7"/>',
cart:'<path d="M2.500 3.500h3l2.200 10.500h10.600l2-7.500H6.500"/><circle cx="9.500" cy="19" r="1.600"/><circle cx="17" cy="19" r="1.600"/>',
fuel:'<path d="M4 21V4.500A1.500 1.500 0 0 1 5.500 3h7A1.500 1.500 0 0 1 14 4.500V21M3 21h12M4 10h10M14 8l3 2.500v6a1.500 1.500 0 0 0 3 0V8l-2.500-2.500"/>',
food:'<path d="M7 3v8M4.500 3v5a2.500 2.500 0 0 0 5 0V3M7 11v10M17 21V3c-2.500 1.500-3.500 4.500-3.500 8H17"/>',
bag:'<path d="M5 8h14l-1 12.500H6zM8.500 8V6.500a3.500 3.500 0 0 1 7 0V8"/>',
card:'<rect x="2.500" y="5" width="19" height="14" rx="2.500"/><path d="M2.500 10h19M6 15h4"/>',
atm:'<rect x="4" y="3" width="16" height="18" rx="2"/><rect x="7" y="6" width="10" height="5"/><path d="M8 15h8M8 18h5"/>',
mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.500 7l8.500 6.500L20.500 7"/>',
doc:'<path d="M6 2.800h8l5 5V21H6z"/><path d="M14 2.800V8h5M9 12.500h7M9 16h7"/>',
lock:'<rect x="4.500" y="10.500" width="15" height="10.500" rx="2"/><path d="M8 10.500V7.500a4 4 0 0 1 8 0v3"/>',
swap:'<path d="M4 8h16l-4-4M20 16H4l4 4"/>',
chart:'<path d="M3 20h18M5 16l4-5 4 3 6-8"/>',calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h4M8 16h2M12 16h4"/>',chk:'<path d="M4.500 12.500l5 5 10-11" stroke-width="2.500"/>'
};
const ico=(n,s=24,st)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" ${st?`style="${st}"`:''}>${P[n]}</svg>`;
const LG='<svg viewBox="0 0 24 24"><circle cx="12" cy="4.800" r="2.600" fill="#fff"/><path d="M5 9.500H19V12.800H8.500V13.600H19V19.500H5V16.200H15.500V15.400H5Z" fill="#fff"/></svg>';
const logo=c=>`<div class="logo ${c||''}">${LG}</div>`;
const eur=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const rnd=n=>Array.from({length:n},()=>Math.floor(Math.random()*10)).join('');
const fakeIban=()=>'DE'+rnd(2)+'28050100'+rnd(10);
const fmtI=i=>i.replace(/(.{4})/g,'$1 ').trim();
const pad=n=>String(n).padStart(2,'0');
const num=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'));
const U=()=>{const u=DB.users[me];if(u&&!u.pos){u.pos=[];u.sp=[];u.req=[];u.ap=[];u.so=u.so||[]}return u};
const bal=a=>{const u=U();return Math.round((u.base[a]+u.tx.filter(t=>t.acc===a).reduce((s,t)=>s+t.amt,0))*100)/100};
const dstr=d=>`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
const tstr=d=>`${pad(d.getDate())}.${pad(d.getMonth()+1)}/${pad(d.getHours())}.${pad(d.getMinutes())}UHR`;
const val=id=>(($('#'+id)||{}).value||'');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('show'),2400)}
const go=(v,t,s,a)=>{view=v;if(t)tab=t;sub=s||null;arg=a;draft={};q='';flt='all';H=[];render()};
const nav=(s,a)=>{H.push([sub,arg]);sub=s;arg=a;render()};
const back=()=>{const p=H.pop()||[null];sub=p[0];arg=p[1];render()};
const hd=t=>`<div class="hd"><div class="bar"><div class="bk" onclick="back()">${ico('bk',26)}</div><b>${t}</b><div class="bk"></div></div></div>`;
const fld=(id,l,v,ex)=>`<div class="fld"><label>${l}</label><input id="${id}" value="${v||''}" ${ex||''}></div>`;
const cat=n=>{n=n.toUpperCase();return /REWE|EDEKA|ALDI|LIDL|NETTO|KAUFLAND|PENNY|DM |ROSSMANN|NORMA/.test(n)?'cart':/SHELL|ARAL|ESSO|TOTAL|JET|AGIP|TANK/.test(n)?'fuel':/MCDON|BURGER|PIZZA|REST|CAFE|CAFÉ|STARBUCKS|DÖNER|DONER|BÄCKER|BAECKER|SUSHI|KFC|SUBWAY|DELI/.test(n)?'food':/AMAZON|PAYPAL|NETFLIX|SPOTIFY|APPLE|GOOGLE|ZALANDO|EBAY|STEAM|OTTO|DISNEY/.test(n)?'bag':'card'};
function tic(t){const k=t.k;
 if(k==='bank')return `<div class="tc r">${LG.replace('<svg','<svg width="60%" height="60%"')}</div>`;
 if(k==='atm')return `<div class="tc" style="color:#1d4f9c">${ico('atm',24)}</div>`;
 if(k==='card'){const c=cat(t.n);return `<div class="tc" style="color:${{cart:'#2e8b3d',fuel:'#d6761a',food:'#c43a2f',bag:'#2f5fc4',card:'#444'}[c]}">${ico(c,24)}</div>`}
 if(k==='inv')return `<div class="tc dk">${ico('chart',24)}</div>`;
 if(k==='so')return `<div class="tc dk">${ico('clk',24)}</div>`;
 if(k==='own')return `<div class="tc dk">${ico('swap',22)}</div>`;
 return `<div class="tc dash"></div>`}

function standing(){const u=U(),now=Date.now();let ch=0;
 (u.so||[]).forEach(s=>{while(s.next<=now){u.tx.push({id:s.next+Math.random(),t:s.next,acc:'giro',amt:-s.amt,n:s.name,s:s.zweck||'Dauerauftrag',k:'so',iban:s.iban});const d=new Date(s.next);s.next=new Date(d.getFullYear(),d.getMonth()+1,Math.min(s.day,28),8,0).getTime();ch=1}});(u.sp||[]).forEach(p=>{while(p.next<=now){const x=SEC.find(y=>y.i===p.i),pr=px(x),q=Math.round(p.amt/pr*10000)/10000;
  if(bal('giro')>=p.amt){u.tx.push({id:p.next+Math.random(),t:p.next,acc:'giro',amt:-p.amt,n:'Sparplan '+x.n,s:q+' Stk. à '+eur(pr)+' · '+x.i,k:'inv'});addPos(x.i,q,pr)}
  else u.mail.push({t:p.next,h:'Sparplan nicht ausgeführt',b:'Der Sparplan für '+x.n+' konnte mangels Deckung nicht ausgeführt werden.'});
  const d=new Date(p.next);p.next=new Date(d.getFullYear(),d.getMonth()+1,Math.min(p.day,28),9,0).getTime();ch=1}});
 if(ch)save()}
function render(){
 if(view==='login'){const r=DB.rem||{};app.innerHTML=`<div class="scr"><div class="hd"><div class="bar"><div class="bk" onclick="location.reload()">${ico('bk',26)}</div><b>Anmeldung</b><div class="bk"></div></div></div><div class="bd">${logo('l')}
 ${fld('ln','Anmeldename',r.l,'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"')}
 <div class="fld"><label>Online-Banking-PIN</label><input id="lp" type="password" inputmode="numeric" value="${r.p||''}" onkeydown="if(event.key==='Enter')doLogin()"></div>
 <div class="row sp" style="margin:.2rem .2rem 1rem;font-size:1.1rem"><span>Online-Banking-PIN speichern</span><div class="tog ${rem?'on':''}" onclick="rem=!rem;this.classList.toggle('on')"></div></div>
 <a class="lnk" onclick="go('reg')">Zugangsdaten vergessen</a></div>
 <div class="sticky"><button class="btn" onclick="doLogin()">Anmelden</button></div></div>`;return}
 if(view==='reg'){app.innerHTML=`<div class="scr"><div class="hd"><div class="bar"><div class="bk" onclick="go('login')">${ico('bk',26)}</div><b>Zugang einrichten</b><div class="bk"></div></div></div><div class="bd">
 ${fld('rn','Vor- und Nachname')}${fld('rl','Anmeldename','','autocapitalize="off" autocorrect="off"')}
 ${fld('rp','Online-Banking-PIN (min. 4 Ziffern)','','type="password" inputmode="numeric"')}${fld('rp2','PIN wiederholen','','type="password" inputmode="numeric"')}
 ${fld('rb','Kontostand Girokonto (€)','254,12','inputmode="decimal"')}${fld('rs','Kontostand Sparkassenbuch (€)','5500,00','inputmode="decimal"')}
 <button class="btn" onclick="doReg()">Registrieren</button></div></div>`;return}
 standing();
 app.innerHTML=`<div class="scr">${sub?subv():main()}</div>${sub?'':tabbar()}`;
}
function doReg(){const n=val('rn').trim(),l=val('rl').trim().toLowerCase(),p=val('rp');
 if(!n||!l)return toast('Bitte alle Felder ausfüllen');if(DB.users[l])return toast('Anmeldename bereits vergeben');
 if(!/^\d{4,}$/.test(p))return toast('PIN: mindestens 4 Ziffern');if(p!==val('rp2'))return toast('PINs stimmen nicht überein');
 const now=new Date(),f=new Date(now.getFullYear(),now.getMonth(),1,8,0),lm=new Date(now.getFullYear(),now.getMonth(),0);

const SEC=[{i:'DE0008469008',n:'Deka DAX UCITS ETF',p:132.4,ph:1},{i:'IE00B4L5Y983',n:'iShares Core MSCI World',p:98.15,ph:2},{i:'US0378331005',n:'Apple Inc.',p:231.2,ph:3},{i:'DE0007164600',n:'SAP SE',p:245.6,ph:4},{i:'DE0007664039',n:'Volkswagen Vz.',p:104.8,ph:5},{i:'DE0005190003',n:'BMW St.',p:88.3,ph:6},{i:'US88160R1014',n:'Tesla Inc.',p:312.5,ph:7},{i:'DE0008404005',n:'Allianz SE',p:318.9,ph:8},{i:'DE0005557508',n:'Deutsche Telekom',p:29.45,ph:9},{i:'LU0292096186',n:'Xtrackers MSCI World Swap',p:112.7,ph:10}];
const px=x=>Math.round(x.p*(1+.03*Math.sin(Date.now()/9e5+x.ph))*100)/100;
const cg=x=>(px(x)/(x.p*(1+.03*Math.sin(Date.now()/9e5-.3+x.ph)))-1)*100;
const cgs=x=>{const c=cg(x);return `<span style="color:${c>=0?'var(--g)':'#ff7b7b'}">${c>=0?'+':'−'}${Math.abs(c).toFixed(2).replace('.',',')} %</span>`};
const dv=()=>U().pos.reduce((a,p)=>a+p.q*px(SEC.find(x=>x.i===p.i)),0);
function addPos(i,q,pr){const u=U();let h=u.pos.find(x=>x.i===i);if(h){h.avg=(h.avg*h.q+pr*q)/(h.q+q);h.q=Math.round((h.q+q)*10000)/10000}else u.pos.push({i,q,avg:pr})}
const secrow=x=>`<div class="card tx" onclick="nav('secp','${x.i}')"><div class="row sp"><div class="row"><div class="tc dk">${ico('chart',24)}</div><div style="min-width:0"><div class="n">${x.n}</div><div class="d">${x.i}</div></div></div><div style="text-align:right"><b>${eur(px(x))}</b><div style="font-size:.95rem">${cgs(x)}</div></div></div></div>`;
function anl(){const u=U(),v=dv(),c=u.pos.reduce((a,p)=>a+p.q*p.avg,0),pl=v-c;
 return `<div class="card" onclick="nav('dep')"><div class="ch"><b>Depot</b>${ico('chev',20)}</div><div class="cr"><div class="row">${logo()}<div><b class="t">Sparkassen-Depot</b><div class="s">Verrechnung: ${AN.giro}</div></div></div><div class="gr">${eur(v)}</div>${u.pos.length?`<div class="s" style="text-align:right;color:${pl>=0?'var(--g)':'#ff7b7b'}">${pl>=0?'+':'−'}${eur(Math.abs(pl))} gesamt</div>`:''}</div></div>
 <div class="qa"><div onclick="q='';nav('secl')"><div class="cb">${ico('chart',30)}</div>Wertpapiere kaufen</div><div onclick="nav('sp')"><div class="cb">${ico('clk',30)}</div>Sparplan</div><div onclick="nav('calc','zins')"><div class="cb">${ico('calc',30)}</div>Anlagerechner</div><div onclick="draft={from:'giro',own:1};nav('send')"><div class="cb">${ico('swap',30)}</div>Sparkassenbuch einzahlen</div></div>
 <div class="row sp" style="margin:.6rem .3rem .6rem"><b style="font-size:1.15rem">Beliebte Wertpapiere</b><u style="color:#8ec1ff;font-weight:600" onclick="q='';nav('secl')">Alle anzeigen</u></div>${SEC.slice(0,5).map(secrow).join('')}${sav()}`}
function secl(){const t=q.toLowerCase();return hd('Wertpapiere')+`<div class="bd"><div class="fld"><label>Name oder ISIN</label><input id="sq" value="${q}" oninput="q=this.value;const p=this.selectionStart;render();const e=$('#sq');e.focus();e.setSelectionRange(p,p)"></div>${SEC.filter(x=>(x.n+x.i).toLowerCase().includes(t)).map(secrow).join('')||'<div class="sm" style="text-align:center;margin:2rem 0">Keine Treffer</div>'}</div>`}
function secp(){const x=SEC.find(y=>y.i===arg),p=px(x),h=U().pos.find(y=>y.i===x.i);
 return hd(x.n)+`<div class="bd"><div class="card" style="text-align:center;padding:1.2rem"><div class="sm">${x.i}</div><div style="font-size:2.2rem;font-weight:600">${eur(p)}</div><div>${cgs(x)} heute</div></div>
 ${h?`<div class="card" style="padding:0 1rem"><div class="kv"><span>Bestand</span><span>${h.q} Stk.</span></div><div class="kv"><span>Ø Kaufkurs</span><span>${eur(h.avg)}</span></div><div class="kv" style="border:0"><span>Aktueller Wert</span><span>${eur(h.q*p)}</span></div></div>`:''}
 ${fld('tq','Stückzahl','','inputmode="decimal" oninput="tot()"')}<div class="sm" id="tt" style="margin:-.4rem .3rem 1rem">Orderentgelt 1,50 € · Verrechnungskonto ${eur(bal('giro'))}</div>
 <button class="btn" onclick="trade('buy')">Kaufen</button><button class="btn g" onclick="trade('sell')">Verkaufen</button></div>`}
function tot(){const x=SEC.find(y=>y.i===arg),n=num(val('tq'))||0;$('#tt').textContent='Gesamt ca. '+eur(n*px(x)+1.5)+' inkl. Orderentgelt'}
const r2=n=>Math.round(n*100)/100;
function trade(side){const u=U(),x=SEC.find(y=>y.i===arg),q=num(val('tq')),p=px(x),h=u.pos.find(y=>y.i===x.i);
 if(!q||q<=0)return toast('Bitte Stückzahl eingeben');
 if(side==='buy'){const c=r2(q*p+1.5);if(bal('giro')<c)return toast('Verrechnungskonto nicht ausreichend gedeckt');
  pin(()=>{const n=Date.now();u.tx.push({id:n,t:n,acc:'giro',amt:-c,n:'Wertpapierkauf '+x.n,s:q+' Stk. à '+eur(p)+' · '+x.i,k:'inv'});addPos(x.i,q,p);save();toast('Kauforder ausgeführt');render()})}
 else{if(!h||q>h.q)return toast('Nicht genügend Stücke im Depot');const c=r2(q*p-1.5);
  pin(()=>{const n=Date.now();u.tx.push({id:n,t:n,acc:'giro',amt:c,n:'Wertpapierverkauf '+x.n,s:q+' Stk. à '+eur(p)+' · '+x.i,k:'inv'});h.q=Math.round((h.q-q)*10000)/10000;if(h.q<=0)u.pos=u.pos.filter(y=>y!==h);save();toast('Verkaufsorder ausgeführt');render()})}}
function dep(){const u=U(),v=dv(),c=u.pos.reduce((a,p)=>a+p.q*p.avg,0),pl=v-c;
 return hd('Depot')+`<div class="bd"><div class="card" style="text-align:center;padding:1.2rem"><div class="sm">Depotwert</div><div class="amt">${eur(v)}</div><div style="color:${pl>=0?'var(--g)':'#ff7b7b'}">${pl>=0?'+':'−'}${eur(Math.abs(pl))} seit Kauf</div></div>
 ${u.pos.map(p=>{const x=SEC.find(y=>y.i===p.i),w=p.q*px(x);return `<div class="card tx" onclick="nav('secp','${x.i}')"><div class="row sp"><div><div class="n">${x.n}</div><div class="d">${p.q} Stk. · Ø ${eur(p.avg)}</div></div><div style="text-align:right"><b>${eur(w)}</b><div style="font-size:.95rem">${cgs(x)}</div></div></div></div>`}).join('')||'<div class="sm" style="text-align:center;margin:2rem 0">Ihr Depot ist noch leer</div>'}
 <button class="btn" onclick="q='';nav('secl')">Wertpapier kaufen</button></div>`}
function sp(){const u=U(),f=draft.f;
 return hd('Sparpläne')+`<div class="bd">${u.sp.map((p,i)=>{const x=SEC.find(y=>y.i===p.i);return `<div class="card tx"><div class="row sp"><div><b>${x.n}</b><div class="d">monatlich am ${p.day}. · ${eur(p.amt)}</div><div class="d">Nächste Ausführung: ${dstr(new Date(p.next))}</div></div><div class="x" onclick="U().sp.splice(${i},1);save();render()">✕</div></div></div>`}).join('')||'<div class="sm" style="text-align:center;margin:1.5rem 0">Keine Sparpläne</div>'}
 ${f?`<div class="card" style="padding:1rem"><div class="fld"><label>Wertpapier</label><select id="pi">${SEC.map(x=>`<option value="${x.i}">${x.n}</option>`).join('')}</select></div>${fld('pa','Sparrate monatlich (€)','50','inputmode="decimal"')}${fld('pd','Tag im Monat (1–28)','1','inputmode="numeric"')}<button class="btn" onclick="addSp()">Sparplan anlegen</button></div>`:`<button class="btn" onclick="draft.f=1;render()">Sparplan anlegen</button>`}</div>`}
function addSp(){const a=Math.abs(num(val('pa'))),d=Math.min(28,Math.max(1,parseInt(val('pd'))||1));if(!a)return toast('Sparrate angeben');
 const n=new Date();let nx=new Date(n.getFullYear(),n.getMonth(),d,9,0);if(nx<=n)nx=new Date(n.getFullYear(),n.getMonth()+1,d,9,0);
 U().sp.push({i:val('pi'),amt:a,day:d,next:nx.getTime()});save();draft={};toast('Sparplan angelegt');render()}

function immo(){const I=[['calc','Baufinanzierung berechnen','Monatsrate, Restschuld und Laufzeit',"nav('calc','fin')"],['doc','Kaufnebenkosten','Steuer, Makler und Notar',"nav('calc','nk')"],['homeo','Immobilienwert schätzen','Schnelle Wertermittlung',"nav('calc','wert')"],['prod','Bausparen','Ansparzeit und Darlehen',"nav('calc','bs')"],['cal','Beratungstermin vereinbaren','Persönlich in Ihrer Filiale',"nav('appt')"]];
 const u=U();return `<div class="card" style="padding:1.2rem"><div class="row">${logo()}<div><b style="font-size:1.25rem">Rund um Ihre Immobilie</b><div class="sm" style="font-size:1rem">Kaufen, bauen, modernisieren</div></div></div></div>
 ${I.map(i=>`<div class="card ch" onclick="${i[3]}"><div class="row"><div class="cb">${ico(i[0],26)}</div><div><b style="font-size:1.1rem">${i[1]}</b><div class="sm">${i[2]}</div></div></div>${ico('chev',20)}</div>`).join('')}
 ${u.ap.length?`<div class="row sp" style="margin:1rem .3rem .6rem"><b style="font-size:1.15rem">Meine Termine</b></div>${u.ap.map((a,i)=>`<div class="card tx"><div class="row sp"><div><b>${a.th}</b><div class="d">${a.d} · ${a.z} Uhr</div></div><div class="x" onclick="U().ap.splice(${i},1);save();render()">✕</div></div></div>`).join('')}`:''}`}
const CK={zins:{t:'Anlagerechner',f:[['Startkapital (€)','5000'],['Monatliche Sparrate (€)','100'],['Zinssatz p.a. (%)','2,5'],['Laufzeit (Jahre)','10']]},
 fin:{t:'Baufinanzierung',f:[['Kaufpreis (€)','350000'],['Eigenkapital (€)','70000'],['Sollzins p.a. (%)','3,6'],['Anfängliche Tilgung (%)','2'],['Zinsbindung (Jahre)','10']]},
 nk:{t:'Kaufnebenkosten',f:[['Kaufpreis (€)','350000'],['Grunderwerbsteuer (%)','5'],['Maklerprovision (%)','3,57'],['Notar und Grundbuch (%)','2']]},
 wert:{t:'Immobilienwert',f:[['Wohnfläche (m²)','120'],['Preis je m² (€)','3200'],['Baujahr','1995'],['Zustand (1 sehr gut – 4 sanierungsbedürftig)','2']]},
 bs:{t:'Bausparen',f:[['Bausparsumme (€)','50000'],['Monatliche Sparrate (€)','250'],['Darlehenszins (%)','2,25']]}};
function calc(){const c=CK[arg];setTimeout(cc,0);return hd(c.t)+`<div class="bd">${c.f.map((f,i)=>fld('k'+i,f[0],f[1],'inputmode="decimal" oninput="cc()"')).join('')}<div class="card" style="padding:0 1rem" id="cr"></div>${arg==='fin'?`<button class="btn" onclick="reqFin()">Unverbindlich anfragen</button>`:''}<button class="btn g" onclick="nav('appt')">Beratungstermin vereinbaren</button></div>`}
const kv=(a,b,g)=>`<div class="kv"><span>${a}</span><span style="${g?'color:var(--g);font-weight:700;font-size:1.15rem':''}">${b}</span></div>`;
function cv(){return CK[arg].f.map((f,i)=>num(val('k'+i))||0)}
function cc(){const el=$('#cr');if(!el)return;const k=cv();let h='';
 if(arg==='zins'){const r=k[2]/1200,n=k[3]*12,g=r?Math.pow(1+r,n):1,e=k[0]*g+(r?k[1]*(g-1)/r:k[1]*n),ein=k[0]+k[1]*n;h=kv('Eingezahlt',eur(ein))+kv('Zinsertrag',eur(e-ein))+kv('Endkapital',eur(e),1)}
 if(arg==='fin'){const D=Math.max(0,k[0]-k[1]),r=k[2]/1200,rate=D*(k[2]+k[3])/1200;let B=D;for(let m=0;m<k[4]*12;m++){B=B*(1+r)-rate;if(B<0){B=0;break}}
  const n=rate>D*r&&D>0&&r>0?-Math.log(1-D*r/rate)/Math.log(1+r)/12:0;h=kv('Darlehensbetrag',eur(D))+kv('Beleihungsauslauf',(k[0]?D/k[0]*100:0).toFixed(1).replace('.',',')+' %')+kv('Restschuld nach '+k[4]+' Jahren',eur(B))+kv('Gesamtlaufzeit ca.',n.toFixed(1).replace('.',',')+' Jahre')+kv('Zinskosten gesamt ca.',eur(Math.max(0,rate*n*12-D)))+kv('Monatliche Rate',eur(rate),1)}
 if(arg==='nk'){const n=k[0]*(k[1]+k[2]+k[3])/100;h=kv('Grunderwerbsteuer',eur(k[0]*k[1]/100))+kv('Maklerprovision',eur(k[0]*k[2]/100))+kv('Notar und Grundbuch',eur(k[0]*k[3]/100))+kv('Nebenkosten gesamt',eur(n))+kv('Gesamtkosten',eur(k[0]+n),1)}
 if(arg==='wert'){const af=Math.max(.6,1-(2026-k[2])*.008),zf=[1.1,1,.88,.72][Math.min(4,Math.max(1,Math.round(k[3])))-1],v=k[0]*k[1]*af*zf;h=kv('Untergrenze',eur(v*.92))+kv('Obergrenze',eur(v*1.08))+kv('Geschätzter Wert',eur(v),1)}
 if(arg==='bs'){h=kv('Ansparzeit bis Zuteilung ca.',(.4*k[0]/(k[1]||1)/12).toFixed(1).replace('.',',')+' Jahre')+kv('Bauspardarlehen',eur(.6*k[0]))+kv('Darlehensrate monatlich',eur(.6*k[0]*(k[2]+3)/1200),1)}
 el.innerHTML=h}
function reqFin(){const k=cv(),D=Math.max(0,k[0]-k[1]),u=U();u.mail.push({t:Date.now(),h:'Ihre Anfrage zur Baufinanzierung',b:`Kaufpreis ${eur(k[0])}, Eigenkapital ${eur(k[1])}, Darlehen ${eur(D)}, Rate ca. ${eur(D*(k[2]+k[3])/1200)}. Ihr Berater meldet sich in Kürze bei Ihnen.`});save();toast('Anfrage gesendet – Antwort im Postfach')}
function appt(){const T=['Baufinanzierung','Geldanlage und Wertpapiere','Bausparen','Girokonto und Karten','Allgemeine Beratung'],t=new Date(Date.now()+864e5*3),dv=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
 return hd('Beratungstermin')+`<div class="bd"><div class="fld"><label>Thema</label><select id="ath">${T.map(x=>`<option>${x}</option>`).join('')}</select></div>${fld('adt','Wunschdatum',dv,'type="date"')}<div class="fld"><label>Uhrzeit</label><select id="azt">${['09:00','10:00','11:00','13:30','14:30','16:00'].map(x=>`<option>${x}</option>`).join('')}</select></div><button class="btn" onclick="addAp()">Termin anfragen</button></div>`}
function addAp(){const u=U(),d=val('adt');if(!d)return toast('Bitte Datum wählen');const dd=new Date(d);u.ap.push({th:val('ath'),d:dstr(dd),z:val('azt')});u.mail.push({t:Date.now(),h:'Terminbestätigung',b:`Ihr Termin zum Thema „${val('ath')}“ am ${dstr(dd)} um ${val('azt')} Uhr ist bestätigt.`});save();toast('Termin bestätigt');ht='imm';go('app','start')}

const ACT=[['Geld senden','überweisen überweisung zahlung transfer','send',()=>{draft={from:'giro'};nav('send')}],['Umbuchung / Sparkassenbuch einzahlen','umbuchen eigenes konto sparen einzahlen','swap',()=>{draft={from:'giro',own:1};nav('send')}],['Umsätze suchen','buchungen umsatz transaktionen zahlungen','srch',()=>nav('search')],['Kontodetails','iban bic konto details','det',()=>nav('det','giro')],['Daueraufträge','dauerauftrag regelmäßig miete','clk',()=>nav('so')],['Kontoauszüge','auszug auszüge','doc',()=>nav('stmt')],['Karte sperren','karte sperren girocard debit','card',()=>nav('card')],['Postfach','nachrichten post mitteilungen','mail',()=>nav('mail')],['PIN ändern','pin passwort ändern profil','lock',()=>go('app','prof')],['Depot','wertpapiere aktien fonds etf depot','chart',()=>nav('dep')],['Wertpapiere kaufen','aktie etf fonds kaufen verkaufen anlegen börse','chart',()=>{q='';nav('secl')}],['Sparplan','sparplan sparen etf monatlich','clk',()=>nav('sp')],['Anlagerechner','zins zinseszins rechner anlegen','calc',()=>nav('calc','zins')],['Baufinanzierung','immobilie haus kredit darlehen finanzierung bauen kaufen','calc',()=>nav('calc','fin')],['Kaufnebenkosten','nebenkosten notar makler grunderwerbsteuer','doc',()=>nav('calc','nk')],['Immobilienwert schätzen','wert haus wohnung bewertung','homeo',()=>nav('calc','wert')],['Bausparen','bausparvertrag bausparer','prod',()=>nav('calc','bs')],['Beratungstermin vereinbaren','termin berater beratung filiale','cal',()=>nav('appt')],['Girokonto','giro konto kontostand saldo','det',()=>nav('konto','giro')],['Sparkassenbuch','sparbuch knax sparkassenbuch','det',()=>nav('konto','sav')],['Admin-Menü','admin zahlung buchen','lock',()=>nav('admin')],['Immobilien','immobilien tab','homeo',()=>{ht='imm';go('app','start')}],['Anlegen','anlegen geldanlage','chart',()=>{ht='anl';go('app','start')}],['Abmelden','logout ausloggen','lock',()=>{me=null;go('login')}]];
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Spracheingabe wird hier nicht unterstützt');try{const r=new R();r.lang='de-DE';r.onresult=e=>{q=e.results[0][0].transcript;nav('gs')};r.onerror=()=>toast('Spracheingabe nicht möglich');r.start();toast('Ich höre zu …')}catch(e){toast('Spracheingabe nicht möglich')}}
function gs(){const t=q.toLowerCase().split(/\s+/).filter(Boolean),u=U();
 const A=ACT.map((a,i)=>({a,i,sc:t.filter(w=>(a[0]+' '+a[1]).toLowerCase().includes(w)).length})).filter(x=>t.length?x.sc:x.i<8).sort((x,y)=>y.sc-x.sc).slice(0,8);
 const T=t.length?u.tx.filter(x=>t.every(w=>(x.n+' '+(x.s||'')+' '+String(x.amt).replace('.',',')).toLowerCase().includes(w))).sort((a,b)=>b.t-a.t).slice(0,10):[];
 const S=t.length?SEC.filter(x=>t.every(w=>(x.n+x.i).toLowerCase().includes(w))):[];
 const sh=x=>`<div class="dt" style="font-weight:600">${x}</div>`;
 return `<div class="hd"><div class="bar"><div class="bk" onclick="back()">${ico('bk',26)}</div><b>Suche</b><div class="bk" onclick="voice()" style="justify-content:flex-end">${ico('mic',26)}</div></div></div><div class="bd"><div class="fld"><label>Was möchten Sie tun?</label><input id="gq" value="${q}" autocomplete="off" oninput="q=this.value;const p=this.selectionStart;render();const e=$('#gq');e.focus();e.setSelectionRange(p,p)"></div>
 ${sh(t.length?'Aktionen':'Vorschläge')}${A.map(x=>`<div class="card ch" onclick="ACT[${x.i}][3]()"><div class="row"><div class="cb">${ico(x.a[2],24)}</div><b>${x.a[0]}</b></div>${ico('chev',20)}</div>`).join('')||'<div class="sm">Keine Aktionen gefunden</div>'}
 ${S.length?sh('Wertpapiere')+S.map(secrow).join(''):''}${T.length?sh('Umsätze')+txs(T).replace(/<div class="mh">.*?<\/div>/g,''):''}</div>`}
render();
</script></body></html>
